# git-cliff configuration — used by the release workflow to turn the
# conventional-commit history between two tags into grouped release notes.
#
# This monorepo publishes several packages from one history, so a range
# between two of a package's tags still contains every other package's
# commits. Two scoping flags fix that, and both live in the workflow
# rather than here, because one config file serves every package while
# these values differ per release:
#
#   --include-path 'packages/<pkg>/**'    only this package's commits
#   --tag-pattern  '^<pkg>-v[0-9].*'      only this package's tags
#
# Without the first, notes list unrelated packages' work. Without the
# second, other packages' tags act as release boundaries and one release
# renders as several blocks with repeated headings.
#
# Local use, scoped the same way the workflow does it:
#   git-cliff --config cliff.toml \
#     --include-path 'packages/acp-probe/**' \
#     --tag-pattern '^acp-probe-v[0-9].*' \
#     acp-probe-v0.0.2..acp-probe-v1.0.0
#
# CI use: see .github/workflows/release.yml, which runs git-cliff for
# every tag after a package's first.

[changelog]
header = ""
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {{ commit.message | upper_first }} ({{ commit.id | truncate(length=7, end="") }})
{% endfor %}
{% endfor %}
"""
trim = true
footer = ""

[git]
# Parse commit messages as conventional commits and skip anything that
# isn't conventional — keeps the release notes free of stray "wip" /
# "stuff" commits.
conventional_commits = true
filter_unconventional = true
filter_commits = true

# Tag pattern for git-cliff to recognize releases. This is a monorepo,
# so each package tags under its own prefix
# (`acpx-ai-provider-v…`, `agent-skills-manager-v…`). Old single-package
# `v0.0.1` / `v0.0.2` tags also still match — they remain historically
# valid even though new releases no longer use that scheme.
#
# This union pattern is the fallback for ad-hoc local runs. The release
# workflow overrides it with `--tag-pattern` for the single package being
# released; leaving the union in effect there would let a sibling
# package's tag split one release into several sections.
tag_pattern = "^(acpx-ai-provider-|acpx-ai-harness-|agent-mcp-manager-|agent-skills-manager-|acp-probe-|)v[0-9].*"

# How each conventional-commit prefix maps to a section in the changelog.
# Order matters — first match wins.
commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Refactor" },
  { message = "^docs?", group = "Documentation" },
  { message = "^style", group = "Styling" },
  { message = "^test", group = "Tests" },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore\\(deps\\)", group = "Dependencies" },
  { message = "^chore", group = "Miscellaneous" },
  { message = "^ci", group = "CI" },
  { message = "^revert", group = "Reverts" },
]

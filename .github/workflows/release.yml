# Tag-triggered npm release + draft GitHub Release.
#
# This repo is a multi-package monorepo. Each package releases under its
# own tag-prefix, so a single tag never tries to publish two packages.
#
# How to cut a release:
#   1. Bump version in packages/<pkg>/package.json
#   2. Commit ("chore(release): <pkg> X.Y.Z") — `chore(release)` is
#      filtered out of cliff.toml so the bump commit doesn't pollute the
#      next changelog.
#   3. git tag <pkg>-vX.Y.Z && git push origin main --tags
#         e.g. acpx-ai-provider-v0.0.3
#              agent-skills-manager-v0.1.0
#   4. Wait for the workflow to finish, then approve the staged version
#      (`npm stage approve <stage-id>`) so it goes live on npm.
#   5. Publish the draft from the Releases page.
#
# Historical tags `v0.0.1` and `v0.0.2` (acpx-ai-provider only) remain
# as immutable history; they no longer trigger this workflow. The
# tag-prefix scheme was adopted 2026-05-11 when agent-skills-manager landed.
#
# Authentication: npm trusted publishing (OIDC). No npm token is
# stored or needed. Each package on npmjs.com carries a trusted
# publisher under Settings, pinned to:
#
#   Organization or user   DaniAkash
#   Repository             agent-toolkit
#   Workflow filename      release.yml     (bare filename, not a path)
#   Environment            (blank)         (this workflow declares none)
#   Allowed actions        npm stage publish
#
# Renaming this file, or adding an `environment:` key below, breaks the
# claim match and every publish fails. A trusted publisher cannot be
# edited after creation; it has to be deleted and recreated.
#
# Because staging is the only permitted action, a release is not live
# when this workflow finishes. Approve it with 2FA to publish:
#
#   npm stage list <package>
#   npm stage approve <stage-id>
#
# Staged publishing requires the package to already exist on the
# registry, so the very first release of a NEW package needs direct
# publish access added to its trusted publisher first.

name: Release (npm publish + draft GitHub release)

on:
  push:
    tags:
      - 'acpx-ai-provider-v[0-9]*'
      - 'acpx-ai-harness-v[0-9]*'
      - 'agent-mcp-manager-v[0-9]*'
      - 'agent-skills-manager-v[0-9]*'
      - 'acp-probe-v[0-9]*'
      - 'ai-sdk-microsandbox-v[0-9]*'

permissions:
  contents: write
  id-token: write   # required for npm provenance attestations

jobs:
  release:
    name: Verify, publish, and draft release notes
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history is required so git-cliff (and `git describe`)
          # can walk back to the previous tag and compute the changelog
          # range.
          fetch-depth: 0

      - name: Resolve package from tag prefix
        id: pkg
        # The tag dictates which package this release is for. We refuse
        # to proceed on an unrecognized prefix so a typo (e.g.
        # `skill-manager-v0.1.0`) fails loudly instead of publishing the
        # wrong dir.
        run: |
          TAG="${GITHUB_REF_NAME}"
          case "$TAG" in
            acpx-ai-provider-v*)
              echo "name=acpx-ai-provider" >> "$GITHUB_OUTPUT"
              echo "dir=packages/acpx-ai-provider" >> "$GITHUB_OUTPUT"
              echo "match=acpx-ai-provider-v[0-9]*" >> "$GITHUB_OUTPUT"
              ;;
            acpx-ai-harness-v*)
              echo "name=acpx-ai-harness" >> "$GITHUB_OUTPUT"
              echo "dir=packages/acpx-ai-harness" >> "$GITHUB_OUTPUT"
              echo "match=acpx-ai-harness-v[0-9]*" >> "$GITHUB_OUTPUT"
              ;;
            agent-mcp-manager-v*)
              echo "name=agent-mcp-manager" >> "$GITHUB_OUTPUT"
              echo "dir=packages/agent-mcp-manager" >> "$GITHUB_OUTPUT"
              echo "match=agent-mcp-manager-v[0-9]*" >> "$GITHUB_OUTPUT"
              ;;
            agent-skills-manager-v*)
              echo "name=agent-skills-manager" >> "$GITHUB_OUTPUT"
              echo "dir=packages/agent-skills-manager" >> "$GITHUB_OUTPUT"
              echo "match=agent-skills-manager-v[0-9]*" >> "$GITHUB_OUTPUT"
              ;;
            acp-probe-v*)
              echo "name=acp-probe" >> "$GITHUB_OUTPUT"
              echo "dir=packages/acp-probe" >> "$GITHUB_OUTPUT"
              echo "match=acp-probe-v[0-9]*" >> "$GITHUB_OUTPUT"
              ;;
            ai-sdk-microsandbox-v*)
              echo "name=ai-sdk-microsandbox" >> "$GITHUB_OUTPUT"
              echo "dir=packages/ai-sdk-microsandbox" >> "$GITHUB_OUTPUT"
              echo "match=ai-sdk-microsandbox-v[0-9]*" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unknown tag prefix: $TAG" >&2
              exit 1
              ;;
          esac

      - name: Install Bun
        # Reads the version from `.bun-version` — bumping Bun is a
        # one-line change to that file, reviewed like any other source
        # change.
        uses: oven-sh/setup-bun@v2

      - name: Install Node + npm (for the publish step)
        # All other steps use Bun. Node is here only for `npm`, whose
        # OIDC trusted-publishing support Bun does not implement.
        # `node-version` reads from `.nvmrc` so local and CI agree.
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Drop the _authToken line so OIDC is used
        # `registry-url` above makes setup-node write
        # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` into the
        # npmrc, and it does so even when no token is in the environment.
        # npm treats the presence of that line as "credentials already
        # configured" and never performs the OIDC exchange, then fails
        # with ENEEDAUTH or E404. Removing the line is what lets trusted
        # publishing engage. https://github.com/actions/setup-node/issues/1551
        run: sed -i '/_authToken/d' "$(npm config get userconfig)"

      - name: Upgrade npm
        # Trusted publishing needs npm >= 11.5.1 and `npm stage publish`
        # needs >= 11.15.0. No Node release line bundles a new enough npm
        # dependably, so pin forward rather than inheriting whatever
        # ships with Node.
        run: |
          npm install -g npm@latest
          npm --version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Re-run the full check suite before publishing. A green tag must
      # mean a green workspace — never trust the PR-time CI alone since
      # post-merge changes can shift state.
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      - name: Fallow
        run: bun run fallow
      - name: Tests
        run: bun test
      - name: Build
        run: bun run build

      - name: Determine previous tag (for changelog range)
        id: previous_tag
        run: |
          # We only care about prior releases of the SAME package, so the
          # match pattern is the per-package tag prefix from the resolve
          # step. For the very first release of a package this errors
          # (no prior tag matches) — treat as the "first release" case
          # and short-circuit changelog generation.
          set +e
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 --match "${{ steps.pkg.outputs.match }}" "${GITHUB_REF_NAME}^" 2>/dev/null)
          set -e
          if [ -z "$PREVIOUS_TAG" ]; then
            echo "first_release=true" >> "$GITHUB_OUTPUT"
            echo "No previous tag found — this is the first release of ${{ steps.pkg.outputs.name }}."
          else
            echo "first_release=false" >> "$GITHUB_OUTPUT"
            echo "previous_tag=$PREVIOUS_TAG" >> "$GITHUB_OUTPUT"
            echo "Previous tag: $PREVIOUS_TAG"
          fi

      - name: Generate changelog (subsequent releases only)
        if: steps.previous_tag.outputs.first_release == 'false'
        id: changelog
        # git-cliff parses conventional-commit messages between the
        # previous tag and the new tag, groups them by type per
        # cliff.toml, and exposes the rendered markdown as
        # `steps.changelog.outputs.content`.
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --strip header ${{ steps.previous_tag.outputs.previous_tag }}..${{ github.ref_name }}

      - name: Pick npm dist-tag from version
        id: dist_tag
        # SemVer pre-release versions (0.0.4-rc.1, 0.1.0-beta.2, etc.)
        # must NOT land on the `latest` dist-tag; otherwise
        # `npm i <pkg>` grabs the pre-release for all consumers. We
        # route them onto their own channel based on the suffix.
        # Stable releases (no `-` in the version) stay on `latest`.
        run: |
          VERSION=$(node -p "require('./${{ steps.pkg.outputs.dir }}/package.json').version")
          case "$VERSION" in
            *-alpha*) TAG=alpha ;;
            *-beta*)  TAG=beta ;;
            *-rc*)    TAG=rc ;;
            *-next*)  TAG=next ;;
            *-*)      TAG=next ;;
            *)        TAG=latest ;;
          esac
          echo "Version $VERSION -> dist-tag $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Stage the package on npm
        # No token. Authentication is npm trusted publishing: the
        # `id-token: write` permission above lets the runner mint an OIDC
        # token, which npm exchanges for a short-lived credential after
        # matching org, repository and workflow filename against the
        # trusted publisher configured on each package.
        #
        # `stage publish`, not `publish`: the trusted publisher for these
        # packages permits staging only. A staged version is uploaded but
        # not installable until a maintainer approves it with 2FA, via
        # `npm stage approve <stage-id>` or the package's Versions tab.
        # Run `npm stage list <pkg>` to find the id.
        #
        # `--access public` is required for unscoped packages. `--tag`
        # routes pre-releases onto their own dist-tag (see previous step).
        # No `--provenance`: it is automatic under trusted publishing for
        # public packages from public repositories.
        run: |
          cd "${{ steps.pkg.outputs.dir }}"
          npm stage publish --access public --tag ${{ steps.dist_tag.outputs.tag }}

      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # DRAFT — never auto-publish. Review the body in the GitHub
          # UI and click Publish when ready.
          draft: true
          # `prerelease: true` for anything not on the `latest`
          # dist-tag. GitHub badges the release as "Pre-release" so
          # consumers browsing the Releases page know not to expect
          # semver-stable behavior.
          prerelease: ${{ steps.dist_tag.outputs.tag != 'latest' }}
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          # First release → literal "first release" body. Otherwise →
          # the git-cliff-rendered changelog. The `||` fallback fires
          # when the changelog step was skipped (its output is empty).
          body: ${{ steps.changelog.outputs.content || 'first release' }}

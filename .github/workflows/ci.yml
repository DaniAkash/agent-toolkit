# PR CI, gated behind manual approval.
#
# One-time setup (otherwise the `approve` gate is a no-op):
#   Repo Settings → Environments → New environment → name `ci-approval`
#   → enable "Required reviewers" → add yourself → save.

name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  approve:
    name: Wait for manual approval
    runs-on: ubuntu-latest
    environment: ci-approval
    timeout-minutes: 60
    steps:
      - name: Approved
        run: echo "CI approved by ${{ github.actor }}"

  # `if: ${{ !cancelled() }}` on every step below is deliberate: one CI
  # run surfaces every failure in the diff (lint + typecheck + fallow +
  # tests + build), so the next push can fix all of them at once instead
  # of one-per-cycle.
  checks:
    name: Lint + typecheck + fallow + tests + build
    needs: approve
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # v7 runs on the node24 Actions runtime. v4 is node20, which GitHub
      # is retiring. Dependabot will not offer this bump: major updates
      # are ignored for the github-actions ecosystem.
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        # Pinned to `.bun-version` on purpose. With no version input this
        # action does not fall back to a fixed release: it reads
        # `packageManager` from package.json, then `engines.bun`, and this
        # repo declares `engines.bun: ">=1.3.0"`, a range it resolves to
        # the newest release. CI then follows whatever Bun shipped last,
        # which is how a job here ran 1.4.4 while the repo pinned 1.3.13.
        #
        # Executable caching stays on. This action's `no-cache` input
        # covers only the downloaded Bun binary, never the dependency
        # store, and its cache key is a hash of the versioned download URL
        # which it re-verifies against `bun --revision` after restoring,
        # so it cannot serve a different Bun than the one asked for.
        with:
          bun-version-file: .bun-version

      # setup-bun caches the binary and nothing else: its post step saves
      # exactly one path, the Bun executable. So the dependencies are
      # cached here. One path covers both halves, because `globalStore =
      # true` in bunfig.toml makes this directory the package store as
      # well as the tarball cache: `node_modules` is symlinks into its
      # `links/` subtree.
      #
      # v6 runs on the node24 Actions runtime, matching the other actions
      # in this repo. v4 is node20, which GitHub is retiring.
      #
      # Keyed on the lockfile and the pinned Bun, with no `restore-keys`.
      # A prefix-matched restore would hand `bun install` a store built
      # for a different lockfile or by a different Bun, and with
      # node_modules symlinked INTO this directory that is not a risk
      # worth taking for nothing: a cold install here is ~8s, so an
      # inexact hit saves no time a rebuild would not.
      #
      # Measured in a linux container on this lockfile: the cold install
      # is ~8s and leaves ~500MB here, so this step buys network, not
      # wall clock. GitHub's per-repo cache budget is 10GB with LRU
      # eviction, so if lockfile churn starts evicting more useful
      # entries, deleting this step costs about eight seconds a run.
      - name: Cache bun's dependency store
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-store-${{ runner.os }}-${{ hashFiles('.bun-version') }}-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check the installed tree links
        # A one-line canary. A dependency that resolved but exported
        # nothing surfaced once as 23 unrelated test errors with no
        # pointer at the cause, and that cause was never established, so
        # this stays: if it recurs, for whatever reason, it fails here
        # with a readable message instead of deep inside the suite.
        # Run from the package: `acpx` is its dev dependency, not a root
        # one, so a root-level resolve cannot see it.
        working-directory: packages/acpx-ai-provider
        run: |
          echo "bun $(bun --version)"
          bun -e "import('acpx/runtime').then(m => {
            const missing = ['createAcpRuntime','createAgentRegistry','createFileSessionStore']
              .filter(k => typeof m[k] !== 'function')
            if (missing.length) {
              console.error('acpx/runtime is missing: ' + missing.join(', '))
              process.exit(1)
            }
            console.log('acpx/runtime exports look right')
          })"

      - name: Biome (lint + format)
        if: ${{ !cancelled() }}
        run: bun run lint

      - name: tsc --noEmit (across all packages)
        if: ${{ !cancelled() }}
        run: bun run typecheck

      - name: Fallow (boundaries + dead code)
        if: ${{ !cancelled() }}
        run: bun run fallow

      - name: bun test
        if: ${{ !cancelled() }}
        run: bun test

      - name: bunup build
        if: ${{ !cancelled() }}
        run: bun run build

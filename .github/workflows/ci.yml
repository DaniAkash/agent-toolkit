# PR CI, gated behind manual approval.
#
# One-time setup (otherwise the `approve` gate is a no-op):
#   Repo Settings → Environments → New environment → name `ci-approval`
#   → enable "Required reviewers" → add yourself → save.

name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  approve:
    name: Wait for manual approval
    runs-on: ubuntu-latest
    environment: ci-approval
    timeout-minutes: 60
    steps:
      - name: Approved
        run: echo "CI approved by ${{ github.actor }}"

  # `if: ${{ !cancelled() }}` on every step below is deliberate: one CI
  # run surfaces every failure in the diff (lint + typecheck + fallow +
  # tests + build), so the next push can fix all of them at once instead
  # of one-per-cycle.
  checks:
    name: Lint + typecheck + fallow + tests + build
    needs: approve
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # v7 runs on the node24 Actions runtime. v4 is node20, which GitHub
      # is retiring. Dependabot will not offer this bump: major updates
      # are ignored for the github-actions ecosystem.
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        # `bun-version-file` is required for `.bun-version` to be honoured.
        # Without it this action installs the LATEST bun, which is how a
        # job running `bun install v1.4.4` ended up here while the repo
        # pinned 1.3.13, and how CI drifted onto a version nothing was
        # tested against.
        #
        # Executable caching is left ON (this action's `no-cache` input
        # covers only the downloaded bun binary, not the dependency
        # store). Keyed by the pinned version, so it cannot serve a
        # different bun than the one asked for.
        with:
          bun-version-file: .bun-version

      # setup-bun caches only the bun binary, so the dependencies are
      # cached here. One path covers both, because `globalStore = true` in
      # bunfig.toml makes this directory the package store as well as the
      # tarball cache: `node_modules` is symlinks into its `links/`
      # subtree.
      #
      # Keyed on the lockfile and the pinned bun, so a change to either
      # starts from a clean store, and strict on purpose: no
      # `restore-keys`. Since node_modules symlinks INTO this directory, a
      # partially restored store is not a slow build, it is symlinks
      # pointing at half-populated packages, which is how a module that
      # plainly exports a name reports it missing. This repo has already
      # paid a day for that failure shape. Either the key hits exactly or
      # the store is rebuilt, and `--frozen-lockfile` pins the result to
      # the lockfile either way.
      #
      # Measured: a cold install is ~6s and leaves ~500MB here. The cache
      # mainly saves network, not wall clock, and GitHub's per-repo budget
      # is 10GB with LRU eviction, so if lockfile churn starts evicting
      # other caches, deleting this step costs about six seconds a run.
      - name: Cache bun's dependency store
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-store-${{ runner.os }}-${{ hashFiles('.bun-version') }}-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check the installed tree links
        # A one-line canary, and the thing that makes the cache safe to
        # keep. A half-linked dependency surfaced once as 23 unrelated
        # test errors with no pointer at the cause; if it ever recurs,
        # whatever the reason, it fails here with a readable message
        # instead of deep inside the suite.
        # Run from the package: `acpx` is its dev dependency, not a root
        # one, so a root-level resolve cannot see it.
        working-directory: packages/acpx-ai-provider
        run: |
          echo "bun $(bun --version)"
          bun -e "import('acpx/runtime').then(m => {
            const missing = ['createAcpRuntime','createAgentRegistry','createFileSessionStore']
              .filter(k => typeof m[k] !== 'function')
            if (missing.length) {
              console.error('acpx/runtime is missing: ' + missing.join(', '))
              process.exit(1)
            }
            console.log('acpx/runtime exports look right')
          })"

      - name: Biome (lint + format)
        if: ${{ !cancelled() }}
        run: bun run lint

      - name: tsc --noEmit (across all packages)
        if: ${{ !cancelled() }}
        run: bun run typecheck

      - name: Fallow (boundaries + dead code)
        if: ${{ !cancelled() }}
        run: bun run fallow

      - name: bun test
        if: ${{ !cancelled() }}
        run: bun test

      - name: bunup build
        if: ${{ !cancelled() }}
        run: bun run build
